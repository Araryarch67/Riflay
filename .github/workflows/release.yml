# Builds Riflay for Android, Windows, Linux, macOS and iOS and attaches the files to a
# GitHub release. Runs when a version tag is pushed (`git tag v1.2.0
# && git push origin v1.2.0`), or by hand from the Actions tab. Manual runs keep
# artifacts only unless publish_tag names an existing release to repair;
# platforms picks which builds run.
#
# Each platform uploads as soon as its own build finishes. A draft holds the notes
# until the first upload publishes it; slower or failed platforms do not block the
# others. On tags iOS skips its Simulator test, which checks the same libmpv sound
# settings the macOS job already tests.
#
# Android signing: add these repository secrets so every release is signed with
# the same key (otherwise phones refuse to update over an earlier version):
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Android CI builds require these secrets and verify the release certificate.
#
# macOS and iOS are built without an Apple Developer ID: the macOS app is
# signed ad hoc (Apple Silicon runs nothing unsigned) and the .ipa is unsigned,
# for sideloading. Their libmpv is built here from pinned sources
# (tool/build_libmpv_apple.sh) and cached until that script changes.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Builds to run: all, or some of android, windows, linux, macos, ios (comma-separated)'
        default: all
      publish_tag:
        description: 'Optional existing release tag to repair, for example v1.2.17 (blank = artifacts only)'
        default: ''

# Read-only by default: the build jobs run third-party build tools and need
# nothing more. Only the separate publishing jobs may write release assets.
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'
  RIFLAY_RELEASE_TAG: ${{ inputs.publish_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'android')
    runs-on: ubuntu-24.04
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version from the tag
        shell: bash
        run: echo "BUILD_ARGS=$(tool/ci_version.sh)" >> "$GITHUB_ENV"
      - name: Require release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Android release signing secret: $name"
              exit 1
            fi
          done
      - name: Release key
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Gradle distribution through the asset API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tool/download_release_asset.py \
            https://github.com/gradle/gradle-distributions/releases/download/v9.3.1/gradle-9.3.1-all.zip \
            "$RUNNER_TEMP/gradle-9.3.1-all.zip" \
            --sha256 17f277867f6914d61b1aa02efab1ba7bb439ad652ca485cd8ca6842fccec6e43
          sed -i "s|^distributionUrl=.*|distributionUrl=file\\:$RUNNER_TEMP/gradle-9.3.1-all.zip|" \
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Kotlin compiler through the asset API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$RUNNER_TEMP/kotlin-maven"
          module="$repo/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.4.0"
          mkdir -p "$module" "$HOME/.gradle/init.d"
          python3 tool/download_release_asset.py \
            https://github.com/JetBrains/kotlin/releases/download/v2.4.0/kotlin-compiler-embeddable-2.4.0.jar \
            "$module/kotlin-compiler-embeddable-2.4.0.jar" \
            --sha256 c2b25e8c1c93ec416ba4327f5e31eaec0f0c8847241b9353e294b8db9dce564f
          curl -fsSL --retry 3 --retry-all-errors \
            https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.4.0/kotlin-compiler-embeddable-2.4.0.pom \
            -o "$module/kotlin-compiler-embeddable-2.4.0.pom"
          echo "RIFLAY_KOTLIN_REPO=$repo" >> "$GITHUB_ENV"
          # Only this artifact comes from the local repository; its original POM retains its dependencies.
          cat > "$HOME/.gradle/init.d/riflay-kotlin.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
              project.repositories.exclusiveContent {
                  forRepository {
                      project.repositories.maven {
                          url = project.uri(System.getenv('RIFLAY_KOTLIN_REPO'))
                      }
                  }
                  filter { includeModule('org.jetbrains.kotlin', 'kotlin-compiler-embeddable') }
              }
          }
          GRADLE
      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # One versionCode for every APK (Flutter adds 1000-4000 per ABI by default): a phone
        # can then move between the universal and per-ABI APKs without "can't downgrade".
        run: |
          flutter build apk --release $BUILD_ARGS
          flutter build apk --release --split-per-abi -P force-version-code-ignoring-abi=true $BUILD_ARGS
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Riflay-android.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Riflay-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Riflay-android-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/Riflay-android-x86_64.apk
      - name: Verify APK signing certificates
        shell: bash
        run: |
          expected="$(openssl x509 -in android/release-certificate.pem -outform DER | sha256sum | cut -d ' ' -f 1)"
          signers=("$ANDROID_HOME"/build-tools/*/apksigner)
          for apk in dist/*.apk; do
            actual="$("${signers[0]}" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Unexpected signing certificate: $apk"
              exit 1
            fi
            echo "Verified release certificate: $apk"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'windows')
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version from the tag
        shell: bash
        run: echo "BUILD_ARGS=$(tool/ci_version.sh)" >> "$GITHUB_ENV"
      - name: Audio plugins work (Carla)
        # Carla is a zip to unpack anywhere; the app looks in Downloads, Program Files... The test plays a tone
        # through the app's bridge and Carla's own gain plugin and measures -6 dB.
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\carla.zip"
          python tool/download_release_asset.py https://github.com/falkTX/Carla/releases/download/v2.5.10/Carla-2.5.10-win64.zip $zip --sha256 56264cd860b3e6e7b29221fb1e46d7d8a288fb001500f830bcd739ec7b115650
          if ($LASTEXITCODE -ne 0) { throw 'Carla download failed' }
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '56264CD860B3E6E7B29221FB1E46D7D8A288FB001500F830BCD739EC7B115650') { throw 'Carla download changed' }
          Expand-Archive $zip "$env:USERPROFILE\Downloads"
          flutter test integration_test/plugins_test.dart -d windows
      - name: Build
        shell: bash
        run: flutter build windows --release $BUILD_ARGS
      - name: Visual C++ runtime next to the exe
        # So it starts on PCs without the redistributable installed.
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build/windows/x64/runner/Release/
          }
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/Riflay-windows-x64.zip
      - name: Installer
        shell: bash
        run: |
          choco install innosetup --no-progress -y > /dev/null
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" -Q "-DAppVersion=$(tool/ci_app_version.sh)" \
            "-DSourceDir=$PWD/build/windows/x64/runner/Release" "-DOutputDir=$PWD/dist" windows/installer/riflay.iss
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'linux')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version from the tag
        run: echo "BUILD_ARGS=$(tool/ci_version.sh)" >> "$GITHUB_ENV"
      - name: Build
        run: flutter build linux --release $BUILD_ARGS
      - name: Archive
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release -czf dist/Riflay-linux-x64.tar.gz --transform 's,^bundle,Riflay,' bundle
      - name: .deb and .rpm
        run: linux/packaging/build_packages.sh "$(tool/ci_app_version.sh)" dist
      - name: Arch Linux package
        # makepkg in an archlinux:base-devel container; the filled PKGBUILD and .SRCINFO (for the AUR) go to aur/.
        run: |
          linux/packaging/build_arch.sh "$(tool/ci_app_version.sh)" dist/Riflay-linux-x64.tar.gz             dist/Riflay-linux-x86_64.pkg.tar.zst aur
      - name: AppImage
        run: linux/packaging/build_appimage.sh dist/Riflay-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: aur
          path: aur/
          include-hidden-files: true

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'macos')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build tools
        run: brew install meson ninja nasm pkgconf
      - name: libmpv from the cache
        uses: actions/cache@v6
        with:
          path: third_party/media_kit_libs_macos_audio/macos/Frameworks
          key: libmpv-macos-${{ hashFiles('tool/build_libmpv_apple.sh') }}
      - name: libmpv
        # CMake 4 (macos-26) refuses projects that ask for compatibility with CMake < 3.5.
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: |
          [[ -d third_party/media_kit_libs_macos_audio/macos/Frameworks/Mpv.xcframework ]] || tool/build_libmpv_apple.sh macos
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Plugins through CocoaPods
        # flutter_inappwebview's Swift package targets macOS 10.14 and Xcode 26 rejects it there; through CocoaPods it
        # builds for the app's own minimum (macos/Podfile).
        run: flutter config --no-enable-swift-package-manager
      - name: Version from the tag
        run: echo "BUILD_ARGS=$(tool/ci_version.sh)" >> "$GITHUB_ENV"
      - name: Sound settings work on this libmpv
        # Renders a song through each setting into files and measures it: nothing is heard.
        run: flutter test integration_test/dsp_test.dart -d macos
      - name: Audio plugins work (Carla)
        # Carla has no Homebrew cask; its official disk image, checked against the release's SHA-256.
        # The test plays a tone through the app's bridge and Carla's own gain plugin and measures -6 dB.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tool/download_release_asset.py https://github.com/falkTX/Carla/releases/download/v2.5.10/Carla-2.5.10-macOS-universal.dmg "$RUNNER_TEMP/carla.dmg" \
            --sha256 a30e98409974493ade18f598566628369fee67f179a84e1c2cc3ae46a71808b1
          echo "a30e98409974493ade18f598566628369fee67f179a84e1c2cc3ae46a71808b1  $RUNNER_TEMP/carla.dmg" | shasum -a 256 -c
          hdiutil attach "$RUNNER_TEMP/carla.dmg" -nobrowse -readonly -mountpoint /Volumes/CarlaDisk
          cp -R /Volumes/CarlaDisk/Carla.app /Applications/
          hdiutil detach /Volumes/CarlaDisk
          flutter test integration_test/plugins_test.dart -d macos
      - name: FFmpeg is fetched on first use (AirPlay, TV conversions, tag editor)
        run: |
          brew uninstall --ignore-dependencies ffmpeg 2>/dev/null || true
          flutter test integration_test/zz_ffmpeg_download_test.dart -d macos
      - name: Build
        run: flutter build macos --release $BUILD_ARGS
      - name: .dmg and .zip
        run: |
          app=build/macos/Build/Products/Release/Riflay.app
          codesign --force --deep --sign - "$app"
          mkdir -p dist dmg
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Riflay -srcfolder dmg -ov -format UDZO dist/Riflay-macos.dmg
          ditto -c -k --keepParent "$app" dist/Riflay-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  ios:
    # Publishes independently, just like the other platforms.
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'ios')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build tools
        run: brew install meson ninja nasm pkgconf
      - name: libmpv from the cache
        uses: actions/cache@v6
        with:
          path: third_party/media_kit_libs_ios_audio/ios/Frameworks
          key: libmpv-ios-${{ hashFiles('tool/build_libmpv_apple.sh') }}
      - name: libmpv
        # CMake 4 (macos-26) refuses projects that ask for compatibility with CMake < 3.5.
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: |
          [[ -d third_party/media_kit_libs_ios_audio/ios/Frameworks/Mpv.xcframework ]] || tool/build_libmpv_apple.sh ios
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version from the tag
        run: echo "BUILD_ARGS=$(tool/ci_version.sh)" >> "$GITHUB_ENV"
      - name: Sound settings work on this libmpv (iOS Simulator)
        # By hand only: booting the Simulator and building for it is most of this job's time, and on tags the macOS
        # job has just tested the same libmpv's sound settings.
        if: github.event_name == 'workflow_dispatch' && inputs.publish_tag == ''
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for r, ds in sorted(runtimes.items(), reverse=True) if "iOS" in r for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          flutter test integration_test/dsp_test.dart -d "$udid"
      - name: Build
        run: flutter build ios --release --no-codesign $BUILD_ARGS
      - name: .ipa
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (cd dist && zip -qr Riflay-ios-unsigned.ipa Payload && rm -rf Payload)
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/*

  release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commits since the last release, for the changelog
      - name: Validate recovery target
        if: inputs.publish_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tool/ci_version.sh
          git rev-parse --verify "refs/tags/$RIFLAY_RELEASE_TAG"
          gh release view "$RIFLAY_RELEASE_TAG" > /dev/null
      - name: Changelog and download guide
        if: github.event_name == 'push'
        # What changed since the last published release, then which file to take. GitHub's own
        # generated notes only list pull requests, and most of this work is committed straight to main.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ env.RIFLAY_RELEASE_TAG }}
        run: |
          # A failed API call can print a JSON error to stdout (for example,
          # 404 before the first release). Never use that output as a git ref.
          if ! prev=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null); then
            prev=''
          fi
          if [ -z "$prev" ] || [ "$prev" = "$TAG" ]; then
            prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          fi
          if [ -n "$prev" ]; then range="$prev..$TAG"; else range="$TAG"; fi
          PREV="$prev" RANGE="$range" python3 - > changelog.md <<'PY'
          import os, re, subprocess

          subjects = subprocess.run(
              ['git', 'log', '--no-merges', '--pretty=%s', os.environ['RANGE'], '--'],
              capture_output=True, text=True, check=True).stdout.splitlines()
          kinds = {'feat': 'New', 'fix': 'Fixed', 'perf': 'Faster'}
          buckets = {'New': [], 'Fixed': [], 'Faster': [], 'Other': []}
          for subject in subjects:
              m = re.match(r'^(\w+)(?:\(([^)]*)\))?!?:\s*(.+)$', subject)
              if not m:
                  buckets['Other'].append(subject)
                  continue
              kind, scope, text = m.groups()
              if kind in {'chore', 'ci', 'docs', 'test', 'style', 'build'} or scope in {'ci', 'test'}:
                  continue
              buckets[kinds.get(kind, 'Other')].append(text + (f' ({scope})' if scope else ''))
          lines = []
          for name, items in buckets.items():
              if items:
                  lines += [f'### {name}'] + [f'- {item}' for item in items] + ['']
          prev = os.environ['PREV']
          if prev:
              lines.append(f"**Full Changelog**: https://github.com/{os.environ['REPO']}/compare/{prev}...{os.environ['TAG']}")
          print('\n'.join(lines))
          PY
          cat > guide.md <<'GUIDE'
          **Coming from OpenMusic?** Riflay is its new name. On a computer, Riflay brings over your settings,
          library, playlists, YouTube Music sign-in and downloads the first time it starts (the Windows installer
          and the `.deb` also remove OpenMusic). On Android it installs as a new app: remove OpenMusic yourself,
          and sign in again.

          Downloads appear as each platform finishes building. A slower or failed build does not hold up the others.

          ### Which file?

          **Android** (7.0 and later, up to Android 16): take **Riflay-android.apk**; it runs on every phone.
          The smaller ones are for one kind of processor only: `arm64` fits almost every phone from the last
          years; `arm32` only old 32-bit phones (newer phones refuse it as "not compatible"); `x86_64` is for
          emulators and Chromebooks.

          **Windows**: `Riflay-windows-x64-setup.exe` installs it; the `.zip` runs without installing.
          **Linux**: the `.AppImage` runs anywhere; `.deb` for Debian / Ubuntu; `.rpm` for Fedora / openSUSE;
          `.pkg.tar.zst` for Arch (`sudo pacman -U` it); `.tar.gz` is the plain bundle.
          Each platform includes `SHA256SUMS-<platform>` immediately. The combined `SHA256SUMS` follows once all
          platform uploads have finished.
          With a package manager: `scoop bucket add riflay https://github.com/Araryarch67/scoop-riflay` then
          `scoop install riflay/riflay` on Windows; `brew install --cask araryarch67/riflay/riflay` on Linux and macOS.

          **macOS**: `Riflay-macos.dmg` (drag Riflay to Applications); the `.zip` is the app alone. It is not signed by
          Apple: on first launch use System Settings › Privacy & Security › **Open Anyway**.
          **iOS**: `Riflay-ios-unsigned.ipa`, for sideloading (AltStore, Sideloadly). It appears as soon as its build finishes.
          GUIDE
          { cat changelog.md; echo; echo '---'; echo; cat guide.md; } > release.md
      - name: Prepare release notes
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A rerun updates the notes without turning an already published release back into a draft.
          if gh release view "$RIFLAY_RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RIFLAY_RELEASE_TAG" --notes-file release.md
          else
            gh release create "$RIFLAY_RELEASE_TAG" --verify-tag --draft --title "$RIFLAY_RELEASE_TAG" --notes-file release.md
          fi

  android-asset:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish_tag != ''
    needs: [release, android]
    permissions:
      contents: write
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: android
      tag: ${{ inputs.publish_tag || github.ref_name }}

  windows-asset:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish_tag != ''
    needs: [release, windows]
    permissions:
      contents: write
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: windows
      tag: ${{ inputs.publish_tag || github.ref_name }}

  linux-asset:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish_tag != ''
    needs: [release, linux]
    permissions:
      contents: write
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: linux
      tag: ${{ inputs.publish_tag || github.ref_name }}

  macos-asset:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish_tag != ''
    needs: [release, macos]
    permissions:
      contents: write
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: macos
      tag: ${{ inputs.publish_tag || github.ref_name }}

  ios-asset:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish_tag != ''
    needs: [release, ios]
    permissions:
      contents: write
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: ios
      tag: ${{ inputs.publish_tag || github.ref_name }}

  checksums:
    # Consolidate only successful uploads, even if another platform failed. Individual checksums are already live.
    if: >-
      always() && !cancelled() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish_tag != '') &&
      (needs.android-asset.result == 'success' || needs.windows-asset.result == 'success' ||
       needs.linux-asset.result == 'success' || needs.macos-asset.result == 'success' ||
       needs.ios-asset.result == 'success')
    needs: [android-asset, windows-asset, linux-asset, macos-asset, ios-asset]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: checksums-*
          path: checksums
          merge-multiple: true
      - name: Combined checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$RIFLAY_RELEASE_TAG" --pattern 'SHA256SUMS-*' --dir checksums --clobber
          LC_ALL=C sort -k2 checksums/SHA256SUMS-* > SHA256SUMS
          test -s SHA256SUMS
          gh release upload "$RIFLAY_RELEASE_TAG" SHA256SUMS --clobber

  package-manifests:
    # Package managers need their desktop files; Android and iOS do not delay these updates.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish_tag != ''
    needs: [windows-asset, linux-asset, macos-asset]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: aur
          path: manifests/aur
      - name: Package manifests
        # The combined release checksums have their own job; do not overwrite them with a desktop-only list.
        run: packaging/update_manifests.sh "${RIFLAY_RELEASE_TAG#v}" dist manifests
      - uses: actions/upload-artifact@v7
        with:
          name: package-manifests
          path: manifests/
          include-hidden-files: true
      - name: Attach package manifests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RIFLAY_RELEASE_TAG" manifests/riflay.json manifests/riflay.rb --clobber
      - name: Homebrew tap and Scoop bucket
        # After the release, so its files are there to download: this version's Scoop manifest goes to
        # Araryarch67/scoop-riflay (bucket/) and the cask to Araryarch67/homebrew-riflay (Casks/).
        # Needs the TAP_TOKEN secret (a fine-grained token with Contents: read and write on those two repositories);
        # skipped without it.
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ env.RIFLAY_RELEASE_TAG }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::No TAP_TOKEN secret: the Homebrew tap and Scoop bucket were not updated."
            exit 0
          fi
          publish() { # <repository> <folder> <file>
            local repo="$RUNNER_TEMP/$1"
            git clone -q --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/Araryarch67/$1.git" "$repo"
            mkdir -p "$repo/$2"
            cp "$3" "$repo/$2/"
            git -C "$repo" add -A
            if git -C "$repo" diff --cached --quiet; then
              echo "$1 already has Riflay ${VERSION#v}"
              return
            fi
            git -C "$repo" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "riflay ${VERSION#v}"
            git -C "$repo" push -q origin HEAD
          }
          publish scoop-riflay bucket manifests/riflay.json
          publish homebrew-riflay Casks manifests/riflay.rb
