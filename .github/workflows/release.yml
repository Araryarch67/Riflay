# Builds Riflay for Android, Windows, Linux, macOS and iOS and attaches the
# files to a GitHub release. Runs when a version tag is pushed (`git tag v1.2.0
# && git push origin v1.2.0`), or by hand from the Actions tab (then the files
# are only kept as workflow artifacts, no release is made; `platforms` picks
# which builds run).
#
# Android signing: add these repository secrets so every release is signed with
# the same key (otherwise phones refuse to update over an earlier version):
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the APK is signed with a throwaway debug key.
#
# macOS and iOS are built without an Apple Developer ID: the macOS app is
# signed ad hoc (Apple Silicon runs nothing unsigned) and the .ipa is unsigned,
# for sideloading. Their libmpv is built here from pinned sources
# (tool/build_libmpv_apple.sh) and cached until that script changes.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Builds to run: all, or some of android, windows, linux, macos, ios (comma-separated)'
        default: all

# Read-only by default: the build jobs run third-party build tools and need
# nothing more. Only the job that publishes the release may write.
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'android')
    runs-on: ubuntu-24.04
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version from the tag
        shell: bash
        run: echo "BUILD_ARGS=$(tool/ci_version.sh)" >> "$GITHUB_ENV"
      - name: Release key
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # One versionCode for every APK (Flutter adds 1000-4000 per ABI by default): a phone
        # can then move between the universal and per-ABI APKs without "can't downgrade".
        run: |
          flutter build apk --release $BUILD_ARGS
          flutter build apk --release --split-per-abi -P force-version-code-ignoring-abi=true $BUILD_ARGS
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Riflay-android.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Riflay-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Riflay-android-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/Riflay-android-x86_64.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'windows')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version from the tag
        shell: bash
        run: echo "BUILD_ARGS=$(tool/ci_version.sh)" >> "$GITHUB_ENV"
      - name: Audio plugins work (Carla)
        # Carla is a zip to unpack anywhere; the app looks in Downloads, Program Files... The test plays a tone
        # through the app's bridge and Carla's own gain plugin and measures -6 dB.
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\carla.zip"
          Invoke-WebRequest https://github.com/falkTX/Carla/releases/download/v2.5.10/Carla-2.5.10-win64.zip -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '56264CD860B3E6E7B29221FB1E46D7D8A288FB001500F830BCD739EC7B115650') { throw 'Carla download changed' }
          Expand-Archive $zip "$env:USERPROFILE\Downloads"
          flutter test integration_test/plugins_test.dart -d windows
      - name: Build
        shell: bash
        run: flutter build windows --release $BUILD_ARGS
      - name: Visual C++ runtime next to the exe
        # So it starts on PCs without the redistributable installed.
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build/windows/x64/runner/Release/
          }
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/Riflay-windows-x64.zip
      - name: Installer
        shell: bash
        run: |
          choco install innosetup --no-progress -y > /dev/null
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" -Q "-DAppVersion=$(tool/ci_app_version.sh)" \
            "-DSourceDir=$PWD/build/windows/x64/runner/Release" "-DOutputDir=$PWD/dist" windows/installer/riflay.iss
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'linux')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libwebkit2gtk-4.1-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version from the tag
        run: echo "BUILD_ARGS=$(tool/ci_version.sh)" >> "$GITHUB_ENV"
      - name: Build
        run: flutter build linux --release $BUILD_ARGS
      - name: Archive
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release -czf dist/Riflay-linux-x64.tar.gz --transform 's,^bundle,Riflay,' bundle
      - name: .deb
        run: linux/packaging/build_deb.sh "$(tool/ci_app_version.sh)" dist/Riflay-linux-amd64.deb
      - name: AppImage
        run: linux/packaging/build_appimage.sh dist/Riflay-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'macos')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build tools
        run: brew install meson ninja nasm pkgconf
      - name: libmpv from the cache
        uses: actions/cache@v6
        with:
          path: third_party/media_kit_libs_macos_audio/macos/Frameworks
          key: libmpv-macos-${{ hashFiles('tool/build_libmpv_apple.sh') }}
      - name: libmpv
        run: |
          [[ -d third_party/media_kit_libs_macos_audio/macos/Frameworks/Mpv.xcframework ]] || tool/build_libmpv_apple.sh macos
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version from the tag
        run: echo "BUILD_ARGS=$(tool/ci_version.sh)" >> "$GITHUB_ENV"
      - name: Sound settings work on this libmpv
        # Renders a song through each setting into files and measures it: nothing is heard.
        run: flutter test integration_test/dsp_test.dart -d macos
      - name: Audio plugins work (Carla)
        # Carla has no Homebrew cask; its official disk image, checked against the release's SHA-256.
        # The test plays a tone through the app's bridge and Carla's own gain plugin and measures -6 dB.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/carla.dmg" https://github.com/falkTX/Carla/releases/download/v2.5.10/Carla-2.5.10-macOS-universal.dmg
          echo "a30e98409974493ade18f598566628369fee67f179a84e1c2cc3ae46a71808b1  $RUNNER_TEMP/carla.dmg" | shasum -a 256 -c
          hdiutil attach "$RUNNER_TEMP/carla.dmg" -nobrowse -readonly -mountpoint /Volumes/CarlaDisk
          cp -R /Volumes/CarlaDisk/Carla.app /Applications/
          hdiutil detach /Volumes/CarlaDisk
          flutter test integration_test/plugins_test.dart -d macos
      - name: FFmpeg is fetched on first use (AirPlay, TV conversions, tag editor)
        run: |
          brew uninstall --ignore-dependencies ffmpeg 2>/dev/null || true
          flutter test integration_test/zz_ffmpeg_download_test.dart -d macos
      - name: Build
        run: flutter build macos --release $BUILD_ARGS
      - name: .dmg and .zip
        run: |
          app=build/macos/Build/Products/Release/Riflay.app
          codesign --force --deep --sign - "$app"
          mkdir -p dist dmg
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Riflay -srcfolder dmg -ov -format UDZO dist/Riflay-macos.dmg
          ditto -c -k --keepParent "$app" dist/Riflay-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, 'ios')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build tools
        run: brew install meson ninja nasm pkgconf
      - name: libmpv from the cache
        uses: actions/cache@v6
        with:
          path: third_party/media_kit_libs_ios_audio/ios/Frameworks
          key: libmpv-ios-${{ hashFiles('tool/build_libmpv_apple.sh') }}
      - name: libmpv
        run: |
          [[ -d third_party/media_kit_libs_ios_audio/ios/Frameworks/Mpv.xcframework ]] || tool/build_libmpv_apple.sh ios
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Version from the tag
        run: echo "BUILD_ARGS=$(tool/ci_version.sh)" >> "$GITHUB_ENV"
      - name: Sound settings work on this libmpv (iOS Simulator)
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for r, ds in sorted(runtimes.items(), reverse=True) if "iOS" in r for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          flutter test integration_test/dsp_test.dart -d "$udid"
      - name: Build
        run: flutter build ios --release --no-codesign $BUILD_ARGS
      - name: .ipa
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (cd dist && zip -qr Riflay-ios-unsigned.ipa Payload && rm -rf Payload)
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, linux, macos, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Coming from OpenMusic?** Riflay is its new name. On a computer, Riflay brings over your settings,
            library, playlists, YouTube Music sign-in and downloads the first time it starts (the Windows installer
            and the `.deb` also remove OpenMusic). On Android and iOS it installs as a new app: remove OpenMusic
            yourself, and sign in again.

            ### Which file?

            **Android** (7.0 and later, up to Android 16): take **Riflay-android.apk**; it runs on every phone.
            The smaller ones are for one kind of processor only: `arm64` fits almost every phone from the last
            years; `arm32` only old 32-bit phones (newer phones refuse it as "not compatible"); `x86_64` is for
            emulators and Chromebooks.

            **Windows**: `Riflay-windows-x64-setup.exe` installs it; the `.zip` runs without installing.
            **Linux**: the `.AppImage` runs anywhere; `.deb` for Debian / Ubuntu; `.tar.gz` is the plain bundle.

            **macOS** (12 Monterey and later, Apple Silicon and Intel): open `Riflay-macos.dmg` and drag Riflay
            to Applications. It isn't signed by Apple, so the first time macOS refuses to open it: go to System
            Settings › Privacy & Security, scroll down and choose **Open Anyway**.

            **iOS** (15 and later): `Riflay-ios-unsigned.ipa` isn't signed, so an iPhone won't install it as it is.
            Sideload it with AltStore or Sideloadly, which sign it with your own Apple ID.
