name: Nightly branding
description: Apply the Nightly logo to the platform artwork before packaging
inputs:
  platform:
    description: Release platform to brand
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - shell: bash
      env:
        RIFLAY_BRANDING_PLATFORM: ${{ inputs.platform }}
      run: |
        python -m pip install --disable-pip-version-check --only-binary=:all: Pillow==13.0.0
        python tool/ci_nightly_branding.py "$RIFLAY_BRANDING_PLATFORM"
