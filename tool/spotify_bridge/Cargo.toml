[package]
name = "spotify_bridge"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
librespot-core = "0.8.0"
librespot-metadata = "0.8.0"
librespot-audio = "0.8.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tiny_http = "0.12"
serde_json = "1"
log = "0.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
